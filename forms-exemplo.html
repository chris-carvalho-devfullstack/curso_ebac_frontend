<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <header>
        <h1>Formulários</h1>
    <nav>
        <a href="./index.html" title="Ir para página principal">Home</a>
        <a href="./containers.html" title="Ir para Containers">Containers</a>
        <a href="./listas.html" title="Ir para Listas">Listas</a>
        <a href="./tabelas.html" title="Ir para Tabelas">Tabelas</a>
        <a href="./midia.html" title="Ir para Mídia">Mídia</a>
    </nav>
    </header>
    <br />
    <form>
        <input type="text" placeholder="Seu nome"/>
        <br />
        <label for="email">Seu e-mail</label>
        <input id="email" type="email"/>
        <br />
        <input type="tel" placeholder="Seu telefone"/>
        <br />
        <input type="number" max="10" min="2"/>
        <br />
        <input type="file"/>
        <br />
        <input type="color"/>
        <br />
        <input type="checkbox" id="checkbox-termos"/> <label for="checkbox-termos">Aceite os termos de uso</label>
        <br />
        <p>
            Qual sua cor favorita?</p>
        <input type="radio" name="cor-favorita" id="cor-vermelho"/> <label for="cor-vermelho">Vermelho</label>
        <input type="radio" name="cor-favorita" id="cor-verde"/> <label for="cor-verde">Verde</label>
        <input type="radio" name="cor-favorita" id="cor-azul"/> <label for="cor-azul">Azul</label>
        <br />
        <label>Qual seu filme favorito?</label>
        <select multiple>
            <option>Filme A</option>
            <option>Filme B</option>
            <option>Filme C</option>
        </select>
        <br />
        <textarea></textarea>
        <br />
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        
    </form>
    
    
</body>
</html>
